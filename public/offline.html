<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkoutApp — Hors ligne</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.6); font-size: 0.875rem; line-height: 1.6; max-width: 280px; margin: 0 auto 2rem; }
    button {
      background: #639922;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Pas de connexion</h1>
  <p>WorkoutApp nécessite une connexion pour synchroniser tes données. Vérifie ta connexion et réessaie.</p>
  <button onclick="window.location.reload()">Réessayer</button>
</body>
</html>
